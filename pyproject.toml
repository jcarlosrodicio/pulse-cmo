[project]
name = "pulse"
version = "0.1.0"
description = "AI growth agent for indie products — daily action list, OpenAdapter-powered"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openai>=1.55",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "tenacity>=9.0",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "httpx>=0.28.1",
    "selectolax>=0.3.21",
    "apscheduler>=3.11.2",
    "python-multipart>=0.0.18",
]

[project.scripts]
pulse = "pulse.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse"]

[tool.ruff]
line-length = 100
target-version = "py312"
